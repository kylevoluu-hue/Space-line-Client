# Fabric / Minecraft coordinates for the Space~line client.
# Only stable releases are targeted (1.21.x baseline). Bump these together when
# updating to a newer stable Minecraft release.

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft
minecraft_version=1.21.4
yarn_mappings=1.21.4+build.8
loader_version=0.16.10

# Fabric API
fabric_version=0.114.0+1.21.4

# Mod metadata
mod_version=0.1.0
maven_group=com.spaceline
archives_base_name=spaceline-client
