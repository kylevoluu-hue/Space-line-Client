/*
 * :launcher — the desktop launcher application.
 *
 * Provides both a Swing GUI (the default entry point, FlatLaf-themed) and a
 * headless diagnostic CLI. Core logic — accounts, version + Java resolution,
 * process control, the Modrinth / CurseForge clients — stays UI-free and
 * headless-testable; the GUI is a thin layer over the same LauncherContext.
 */
plugins {
    id 'application'
}

dependencies {
    implementation project(':common')
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'org.slf4j:slf4j-api:2.0.13'

    // Modern flat look-and-feel for the Swing GUI (no native libraries needed).
    implementation 'com.formdev:flatlaf:3.5.4'
    implementation 'com.formdev:flatlaf-extras:3.5.4'
}

application {
    // The GUI window is the default; passing CLI args (e.g. "status") runs the
    // diagnostic CLI instead. See SpaceLineLauncherApp#main.
    mainClass = 'com.spaceline.launcher.gui.SpaceLineLauncherApp'
}

tasks.named('run') {
    systemProperty 'spaceline.headless', findProperty('headless') ?: 'false'
}

/*
 * Native Windows packaging via the JDK's jpackage (bundled with JDK 21+).
 *
 *   gradlew.bat :launcher:packageApp        -> a runnable app folder (Spaceline.exe)
 *   gradlew.bat :launcher:packageInstaller  -> a shareable Spaceline-<ver>.exe installer
 *
 * Both bundle a Java runtime, so the people you share with don't need Java.
 * The INSTALLER additionally requires the free WiX Toolset v3 on PATH
 * (https://github.com/wixtoolset/wix3/releases) — jpackage uses it to build the
 * .exe/.msi. The app folder needs no extra tools.
 *
 * Windows installers require a version whose major component is > 0, so the
 * installer version is taken from the `installerVersion` property (default 1.0.0)
 * rather than the project's 0.x dev version.
 */
def jpackageAppName = 'Spaceline'
def jpackageInstallerVersion = (project.findProperty('installerVersion') ?: '1.0.0').toString()
def jpackageInput = layout.buildDirectory.dir('install/launcher/lib')
def jpackageAppOut = layout.buildDirectory.dir('jpackage/app')
def jpackageInstallerOut = layout.buildDirectory.dir('jpackage/installer')
def jpackageMainJar = "launcher-${project.version}.jar"
def jpackageMainClass = 'com.spaceline.launcher.gui.SpaceLineLauncherApp'
def jpackageIcon = rootProject.file('branding/spaceline.ico').absolutePath

tasks.register('packageApp', Exec) {
    dependsOn 'installDist'
    group = 'distribution'
    description = 'Builds a runnable Windows app folder (Spaceline.exe) via jpackage.'
    doFirst { delete jpackageAppOut; jpackageAppOut.get().asFile.mkdirs() }
    commandLine 'jpackage',
            '--type', 'app-image',
            '--name', jpackageAppName,
            '--app-version', jpackageInstallerVersion,
            '--input', jpackageInput.get().asFile.absolutePath,
            '--main-jar', jpackageMainJar,
            '--main-class', jpackageMainClass,
            '--dest', jpackageAppOut.get().asFile.absolutePath,
            '--icon', jpackageIcon,
            '--vendor', 'Spaceline',
            '--java-options', '-Xmx2g'
}

tasks.register('packageInstaller', Exec) {
    dependsOn 'installDist'
    group = 'distribution'
    description = 'Builds a shareable Windows .exe installer via jpackage (needs WiX Toolset v3).'
    doFirst { delete jpackageInstallerOut; jpackageInstallerOut.get().asFile.mkdirs() }
    commandLine 'jpackage',
            '--type', 'exe',
            '--name', jpackageAppName,
            '--app-version', jpackageInstallerVersion,
            '--input', jpackageInput.get().asFile.absolutePath,
            '--main-jar', jpackageMainJar,
            '--main-class', jpackageMainClass,
            '--dest', jpackageInstallerOut.get().asFile.absolutePath,
            '--icon', jpackageIcon,
            '--vendor', 'Spaceline',
            '--java-options', '-Xmx2g',
            '--win-shortcut',       // create a desktop shortcut
            '--win-menu',           // add to the Start menu
            '--win-menu-group', 'Spaceline',
            '--win-dir-chooser',    // let the user pick the install location
            '--win-per-user-install'
}
